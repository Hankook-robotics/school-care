<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<meta name="color-scheme" content="light only">
<title>일정표 빌더</title>
<style>
:root{
 --bg:#F6F4EF;--panel:#FFFFFF;--panel2:#FBFAF7;--line:#E8E4DC;--line2:#EEEBE4;
 --ink:#2B2B2B;--ink2:#6B6B6B;--ink3:#A3A3A3;
 --acc:#2B2B2B;--acc2:#F2B441;
 --sun:#E0554E;--sat:#3B7DD8;--todaybg:#F3F1EC;
 --bad:#B3261E;
 --c-none:#F1EFEA;--t-none:#3A3A3A;
 --c-blue:#D6E7FA;--t-blue:#1F4E8C;--c-green:#D8F1DF;--t-green:#1E6B3A;--c-yellow:#FFF0B3;--t-yellow:#7A5A00;
 --c-orange:#FFE1C7;--t-orange:#8A4A15;--c-red:#F7C6C1;--t-red:#8F2B25;--c-purple:#E6DAF7;--t-purple:#5B3A8C;
 --shadow:0 1px 0 #E8E4DC,0 12px 30px rgba(60,50,30,.08);--pop:0 16px 40px rgba(40,30,10,.18);
 --cw:34px;--noW:40px;--nameW:200px;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
 color-scheme:light only;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
 background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;letter-spacing:-.2px;-webkit-font-smoothing:antialiased;
 padding-bottom:calc(30px + var(--sb))}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:14px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;line-height:1.2;white-space:nowrap;color:var(--ink2)}
button:hover{border-color:var(--ink3);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.pri:hover{opacity:.88;color:var(--bg)}
button.danger{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* ---------- 상단 ---------- */
.gbar{padding:calc(var(--st) + 14px) 24px 4px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.gbar .brand{font-size:13px;font-weight:700;color:var(--ink2);margin-right:6px}
.board{margin:14px 24px 0}
.top{padding:12px 0 6px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.tbox{flex:1;min-width:280px;display:flex;flex-direction:column;gap:2px}
.top input[type=text]{border:1px dashed transparent;background:transparent;font-weight:800;font-size:22px;letter-spacing:-.5px;padding:4px 8px;margin-left:-8px;width:100%;border-radius:10px;color:var(--ink)}
.top input[type=text]:hover{background:var(--panel);border-color:var(--line)}
.top input[type=text]:placeholder-shown{border-color:var(--acc2);background:var(--panel)}
.top input[type=text]:focus{background:var(--panel);border-color:var(--acc2);outline:none}
.thint{font-size:11px;color:var(--ink3);padding-left:1px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.mt{padding:6px 14px;font-size:12.5px}
.mt.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tools{padding:0 0 12px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.tools .f{display:flex;align-items:center;gap:6px}
.tools label{font-size:12px;color:var(--ink2);white-space:nowrap}
.tools input[type=month]{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);color:var(--ink)}
.tools select{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);color:var(--ink);max-width:240px}
.tools .gap{width:1px;height:22px;background:var(--line);margin:0 4px}
.status{font-size:12px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.bnum{font-size:11px;color:var(--ink3);margin-left:auto}
.addboard{margin:18px 24px 0;display:flex;gap:10px;align-items:center}
.addboard button{border-style:dashed;padding:12px 20px;width:100%;justify-content:center;display:flex;color:var(--ink2)}

/* ---------- 보드 ---------- */
.wrap{overflow:auto;position:relative;margin:0;max-height:70vh;background:var(--panel);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:var(--noW) var(--nameW) repeat(var(--n),var(--cw));grid-auto-rows:minmax(50px,auto);
 background:var(--panel);width:max-content;min-width:100%;padding:0 10px 6px}
.cell{border-bottom:1px dashed var(--line2);position:relative;min-height:0}
.h{background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;position:sticky;top:0;z-index:5;border-bottom:none}
.h.mon{font-size:12.5px;font-weight:700;color:#7A5C3A;justify-content:flex-start;padding-left:6px}
.h.mon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc2);margin-right:6px;flex:none}
.h.day{flex-direction:column;gap:0;font-size:11.5px;font-weight:600;color:var(--ink2);border-radius:10px;margin:3px 1px;top:36px;min-height:38px}
.h.day i{font-style:normal;font-size:10px;color:var(--ink3);font-weight:500}
.h.day.sun,.h.day.sun i{color:var(--sun)}.h.day.sat,.h.day.sat i{color:var(--sat)}
.h.day.today{background:var(--acc);color:var(--bg)}.h.day.today i{color:var(--bg);opacity:.75}
.h.corner{left:0;z-index:8;font-size:11px;color:var(--ink3)}
.h.corner2{left:var(--noW);z-index:8;font-size:11px;color:var(--ink3)}
.h.r2{top:36px}
.grid > .r1{grid-row:1;min-height:36px}
.grid > .r2{grid-row:2;min-height:44px}
.no{position:sticky;left:0;z-index:4;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink3);
 font-size:11px;border:none;border-radius:0;padding:0;border-bottom:1px dashed var(--line2)}
.no:hover{background:var(--panel2);color:var(--ink)}
.name{position:sticky;left:var(--noW);z-index:4;background:var(--panel);display:flex;align-items:center;gap:8px;padding:2px 8px 2px 4px}
.name .sw{width:10px;height:10px;border-radius:3px;background:var(--sw,#CFE3F7);flex:none}
.name input{flex:1;min-width:0;border:none;background:transparent;font-weight:700;font-size:13px;padding:6px 6px;border-radius:8px;color:var(--ink)}
.name input::placeholder{color:var(--ink3);font-weight:500}
.name input:hover{background:var(--panel2)}
.d{cursor:cell}
.d.sun,.d.sat{background:var(--panel2)}
.d.today{background:var(--todaybg)}
.d:hover{background:var(--line2)}
.mstart{border-left:1px solid var(--line)}

.it{position:relative;z-index:2;align-self:stretch;margin:4px 0;padding:0 2px;cursor:pointer;display:flex;align-items:center}
.it .tx{font-size:12px;line-height:1.3;white-space:pre;overflow:hidden;padding:4px 10px;border-radius:999px;background:var(--c-none);color:var(--t-none);font-weight:500}
.it.bar{margin:6px 2px}
.it.bar .tx{white-space:pre-wrap;word-break:break-word;width:100%;font-weight:600}
.it.point{overflow:visible}
.it.point .tx{flex:0 0 auto;width:max-content}
.it:hover .tx{box-shadow:0 0 0 2px var(--acc2)}
.it.c-blue .tx{background:var(--c-blue);color:var(--t-blue)}.it.c-green .tx{background:var(--c-green);color:var(--t-green)}.it.c-yellow .tx{background:var(--c-yellow);color:var(--t-yellow)}
.it.c-orange .tx{background:var(--c-orange);color:var(--t-orange)}.it.c-red .tx{background:var(--c-red);color:var(--t-red)}.it.c-purple .tx{background:var(--c-purple);color:var(--t-purple)}
.addrow{position:sticky;left:0;padding:8px 14px 12px;display:flex;gap:10px;align-items:center;width:max-content}
.hint{font-size:12px;color:var(--ink3)}

/* ---------- 행 메뉴 ---------- */
.rmenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:6px;display:flex;flex-direction:column;min-width:150px}
.rmenu .rt{font-size:11px;color:var(--ink3);padding:6px 10px 4px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmenu button{border:none;border-radius:8px;text-align:left;padding:8px 10px;font-size:13px;color:var(--ink);background:transparent}
.rmenu button:hover{background:var(--panel2)}
.rmenu button.danger{color:var(--bad)}
.rmenu button small{display:block;font-size:11px;color:var(--ink3);font-weight:400}

/* ---------- 편집기 ---------- */
.ovl{position:fixed;inset:0;background:rgba(43,43,43,.32);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.ovl[hidden]{display:none!important}
.ed{background:var(--panel);width:min(480px,100%);border-radius:20px 20px 0 0;box-shadow:var(--pop);padding:18px 18px calc(18px + var(--sb));
 display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
@media (min-width:640px){.ovl{align-items:center;padding:16px}.ed{border-radius:20px;padding-bottom:18px}}
.ed h3{margin:0;font-size:16px;display:flex;align-items:center;justify-content:space-between;font-weight:800}
.ed h3 span{font-weight:500;color:var(--ink2);font-size:12.5px}
.ed .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.ed input[type=date],.ed textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--panel2);width:100%;color:var(--ink)}
.ed textarea{min-height:84px;resize:vertical;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;background:var(--c-none)}
.chip.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--panel) inset}
.chip.c-blue{background:var(--c-blue)}.chip.c-green{background:var(--c-green)}.chip.c-yellow{background:var(--c-yellow)}
.chip.c-orange{background:var(--c-orange)}.chip.c-red{background:var(--c-red)}.chip.c-purple{background:var(--c-purple)}
.ed .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ed .act .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--acc);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--pop);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- 인쇄 ---------- */
@page{size:A3 landscape;margin:10mm}
@media print{
 .gbar,.tools,.addrow,.addboard,.ovl,.toast,.rmenu,.thint,.mtabs{display:none!important}
 .top input[type=text]{border:none;padding:0;margin:0;font-size:20px}
 .board{margin:0 0 16px;page-break-inside:avoid}
 body{background:#fff;display:block}
 .wrap{overflow:visible;margin:0;box-shadow:none;border-radius:0;max-height:none}
 .grid{width:max-content}
 .h,.no,.name{position:static}
 .d:hover{background:inherit}
}
</style>
</head>
<body>

<div class="gbar">
 <span class="brand">일정표 빌더</span>
 <button id="btnAdd" type="button" class="pri">표 추가</button>
 <button id="btnXlsAll" type="button">엑셀 저장 (전체)</button>
 <button id="btnXlsIn" type="button">엑셀 불러오기</button>
 <button id="btnJson" type="button">파일 저장</button>
 <button id="btnJsonIn" type="button">파일 불러오기</button>
 <button id="btnPrint" type="button">인쇄</button>
 <input id="fileXls" type="file" accept=".xlsx" hidden>
 <input id="fileJson" type="file" accept=".json,application/json" hidden>
 <span class="status" id="status">자동 저장됨</span>
</div>

<div id="boards"></div>

<div class="addboard"><button id="btnAdd2" type="button">아래에 빈 표 추가</button></div>

<template id="tplBoard">
 <section class="board">
  <div class="top">
   <div class="tbox"><input class="title" type="text" placeholder="프로젝트명 입력" aria-label="프로젝트명" title="눌러서 프로젝트명 수정"><span class="thint">프로젝트명을 눌러 언제든 수정할 수 있습니다</span></div>
   <div class="mtabs" aria-label="월 이동"></div>
  </div>
  <div class="tools">
   <div class="f"><label>기간</label><input class="start" type="month" aria-label="시작 월"><span class="hint">부터</span><input class="end" type="month" aria-label="종료 월"><span class="hint">까지</span></div>
   <span class="gap"></span>
   <button class="bRow" type="button">행 추가</button>
   <button class="bToday" type="button">오늘</button>
   <span class="gap"></span>
   <button class="bXls pri" type="button">엑셀 저장</button>
   <button class="bShare" type="button">공유</button>
   <button class="bDup" type="button">복제</button>
   <button class="bDel danger" type="button">표 삭제</button>
   <span class="bnum"></span>
  </div>
  <div class="wrap">
   <div class="grid"></div>
   <div class="addrow">
    <button class="bRow2" type="button">행 추가</button>
    <span class="hint">날짜 칸을 누르면 내용을 적을 수 있습니다. 종료일을 넣으면 기간 막대가 되고, 번호를 누르면 행을 옮기거나 지울 수 있습니다.</span>
   </div>
  </div>
 </section>
</template>

<div class="ovl" id="ovl" hidden>
 <div class="ed" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <h3 id="edTitle">일정 입력 <span id="edTask"></span></h3>
  <div class="row">
   <label>시작일<input id="edDate" type="date"></label>
   <label>종료일 (비우면 하루)<input id="edEnd" type="date"></label>
  </div>
  <label>내용<textarea id="edText" placeholder="예) 발주 완료 / 납기 예정일"></textarea></label>
  <div>
   <div class="hint" style="margin-bottom:6px">색상</div>
   <div class="chips" id="chips"></div>
  </div>
  <div class="act">
   <button id="edDelete" type="button" class="danger left">삭제</button>
   <button id="edCancel" type="button">취소</button>
   <button id="edSave" type="button" class="pri">저장</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 데이터 ===================== */
const LS_DOC='schb_doc';
const COLORS=['none','blue','green','yellow','orange','red','purple'];
const COLOR_HEX={blue:'D6E7FA',green:'D8F1DF',yellow:'FFF0B3',orange:'FFE1C7',red:'F7C6C1',purple:'E6DAF7'};
const SWATCH=['#F2B441','#8FBCF0','#F0A29B','#7FD1A2','#C4AEEB','#8CD3D6','#F5B98A','#A9B9E6'];
const WD=['일','월','화','수','목','금','토'];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1);};
const todayStr=fmt(new Date());
const $=id=>document.getElementById(id);

function blank(){
 const d=new Date(); const st=d.getFullYear()+'-'+pad(d.getMonth()+1); const e=new Date(d.getFullYear(),d.getMonth()+3,1);
 return {id:uid(),title:'',start:st,end:e.getFullYear()+'-'+pad(e.getMonth()+1),tasks:Array.from({length:8},()=>({id:uid(),name:'',items:[]}))};
}
function normalize(s){
 s.id=s.id||uid(); s.title=s.title||'';
 if(s.title==='[갤럭시로봇파크] 피자로봇 전체 일정표'||s.title==='[갤럭시로봇파크] ㅇㅇ 일정표'){
  const names=(s.tasks||[]).map(t=>t.name).join('|');
  if(names==='|모형거치대 컨셉|그리퍼 핑거|파우더통|싱크대+작업대|수도공사|PC 프로그램|로봇 티칭'){s.title='';s.tasks=s.tasks.map(t=>({id:t.id||uid(),name:'',items:[]}));}
 }
 s.tasks=(s.tasks||[]).map(t=>({id:t.id||uid(),name:t.name||'',items:(t.items||[]).map(it=>({id:it.id||uid(),date:it.date,end:it.end&&it.end>it.date?it.end:undefined,text:it.text||'',color:COLORS.includes(it.color)?it.color:'none'}))}));
 if(!s.tasks.length)s.tasks=[{id:uid(),name:'',items:[]}];
 if(!s.start||!s.end||s.end<s.start){const b=blank();s.start=s.start||b.start;s.end=s.end<s.start?s.start:(s.end||b.end);}
 return s;
}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let DOC={boards:[]};
function load(){
 try{const d=JSON.parse(ls.get(LS_DOC)||'null'); if(d&&Array.isArray(d.boards)){DOC={boards:d.boards.map(normalize)};}}catch(e){}
 if(!DOC.boards.length){ // 이전 버전(일정표 목록) 이어받기
  try{const list=JSON.parse(ls.get('schb_list')||'[]'); const bs=[];
   list.forEach(m=>{try{const x=JSON.parse(ls.get('schb_'+m.id)||'null');if(x)bs.push(normalize(x));}catch(e){}});
   if(bs.length)DOC.boards=bs;}catch(e){}
 }
 if(!DOC.boards.length)DOC.boards=[blank()];
}
let saveT=null;
function flush(){if(saveT){clearTimeout(saveT);saveT=null;} ls.set(LS_DOC,JSON.stringify(DOC)); status('자동 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));}
function persist(){clearTimeout(saveT); saveT=setTimeout(flush,150);}
window.addEventListener('pagehide',()=>{if(saveT)flush();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)flush();});
function board(id){return DOC.boards.find(b=>b.id===id);}

/* ===================== 날짜 계산 ===================== */
function days(S){
 const out=[]; const s=parse(S.start), e=parse(S.end); e.setMonth(e.getMonth()+1);
 for(let d=new Date(s);d<e;d.setDate(d.getDate()+1)) out.push({s:fmt(d),wd:d.getDay(),day:d.getDate(),m:d.getMonth()+1,y:d.getFullYear()});
 return out;
}
function wc(d){return d.wd===0?' sun':d.wd===6?' sat':''}

/* ===================== 렌더 ===================== */
const V={}; // 표별 화면 상태: {el, DAYS, IDX}
function renderAll(){
 const box=$('boards'); box.innerHTML=''; for(const k in V)delete V[k];
 DOC.boards.forEach(S=>box.appendChild(makeBoard(S)));
}
function makeBoard(S){
 const el=$('tplBoard').content.firstElementChild.cloneNode(true); el.dataset.b=S.id;
 const q=sel=>el.querySelector(sel);
 V[S.id]={el,DAYS:[],IDX:{}};
 q('.title').value=S.title; q('.start').value=S.start; q('.end').value=S.end;
 q('.title').addEventListener('input',e=>{S.title=e.target.value;persist();});
 q('.start').addEventListener('change',e=>{const v=e.target.value;if(!v)return;S.start=v;if(S.end<v){S.end=v;q('.end').value=v;}persist();renderGrid(S);});
 q('.end').addEventListener('change',e=>{const v=e.target.value;if(!v)return;S.end=v;if(S.start>v){S.start=v;q('.start').value=v;}persist();renderGrid(S);});
 q('.bRow').onclick=()=>addRow(S); q('.bRow2').onclick=()=>addRow(S);
 q('.bToday').onclick=()=>{if(V[S.id].IDX[todayStr]==null){toast('오늘이 기간 안에 없습니다');return;}scrollToDate(S,todayStr,true);};
 q('.bXls').onclick=()=>exportXlsx([S],safe(S.title)+'.xlsx');
 q('.bShare').onclick=e=>openShareMenu(S,e.currentTarget);
 q('.bDup').onclick=()=>{const c=JSON.parse(JSON.stringify(S));c.id=uid();c.tasks.forEach(t=>{t.id=uid();t.items.forEach(i=>i.id=uid());});

function markMonthTab(S){

let ED=null;

 const t=S.tasks.find(x=>x.id===taskId); if(!t) return;
 const it=itemId?t.items.find(x=>x.id===itemId):null;
 ED={board:S,task:t,item:it};
 $('edTask').textContent=t.name?t.name:(S.tasks.indexOf(t)+1)+'번 행';
 $('edDate').value=it?it.date:date; $('edEnd').value=it&&it.end?it.end:''; $('edText').value=it?it.text:'';
 setChip(it?it.color:'none'); $('edDelete').hidden=!it;
 $('ovl').hidden=false; setTimeout(()=>$('edText').focus(),30);
}
function setChip(c){ED.color=c;[...$('chips').children].forEach(b=>b.classList.toggle('on',b.dataset.c===c));}
function closeEditor(){$('ovl').hidden=true;ED=null;}
function saveEditor(){
 const S=ED.board; const date=$('edDate').value, endv=$('edEnd').value, text=$('edText').value.trim();
 if(!date){toast('시작일을 입력하세요');return;}
 if(!text){if(ED.item)deleteItem();else closeEditor();return;}
 const end=endv&&endv>date?endv:undefined;
 if(ED.item){Object.assign(ED.item,{date,end,text,color:ED.color});}
 else ED.task.items.push({id:uid(),date,end,text,color:ED.color});
 if(date<S.start+'-01'||date>S.end+'-31')toast('기간 밖의 날짜라 표에는 보이지 않습니다');
 persist();renderGrid(S);closeEditor();
}
function deleteItem(){if(!ED||!ED.item)return;const S=ED.board;ED.task.items=ED.task.items.filter(x=>x!==ED.item);persist();renderGrid(S);closeEditor();}

$('edSave').onclick=saveEditor; $('edCancel').onclick=closeEditor; $('edDelete').onclick=deleteItem;

   D.forEach((d,k)=>{if(d.wd===0||d.wd===6){g.fillStyle=T.panel2;g.fillRect(x0+k*CW,y,CW,h);} if(d.s===todayStr){g.fillStyle=T.today;g.fillRect(x0+k*CW,y,CW,h);}});
   g.setLineDash([3,3]); g.strokeStyle=T.line2; g.beginPath(); g.moveTo(bx+10,y+h); g.lineTo(bx+bw-10,y+h); g.stroke(); g.setLineDash([]);
   txt(String(ti+1),bx+NOW/2,cy,10.5,T.ink3,400,'center');
   rr(bx+NOW+2,cy-5,10,10,3,SWATCH[ti%SWATCH.length]);
   if(t.name){const nl=nameLines(t); if(nl===1)txt(t.name,bx+NOW+18,cy,12.5,T.ink,700,'left',NAMEW-26); else{txt(t.name.slice(0,12),bx+NOW+18,cy-8,12.5,T.ink,700,'left',NAMEW-26);txt(t.name.slice(12),bx+NOW+18,cy+8,12.5,T.ink,700,'left',NAMEW-26);}}
   else txt('항목명',bx+NOW+18,cy,12.5,T.ink3,500);
   const items=t.items.filter(it=>IX[it.date]!=null||(it.end&&it.date<D[0].s&&it.end>=D[0].s)).map(it=>({...it,c:IX[it.date]!=null?IX[it.date]:0})).sort((a,b)=>a.c-b.c);
   items.forEach((it,q)=>{const c=it.c; const next=items[q+1]?items[q+1].c:n; const col=T.cc(it.color);
    const lines=String(it.text).split('\n'); g.font='500 12px '+font;
    if(it.end){const e=IX[it.end]!=null?IX[it.end]:(it.end>D[n-1].s?n-1:c); const span=Math.max(1,Math.min(e-c+1,n-c)); const px=x0+c*CW+2, pw=span*CW-4, ph=Math.min(h-10,lines.length*16+10);
     rr(px,cy-ph/2,pw,ph,ph/2,col.bg); g.save(); g.beginPath(); g.rect(px,cy-ph/2,pw,ph); g.clip();
     lines.forEach((ln,li)=>txt(ln,px+9,cy-(lines.length-1)*8+li*16,12,col.tx,600)); g.restore();}
    else{const free=Math.max(1,Math.min(next-c,n-c)); const maxW=free*CW-4; let tw=0; lines.forEach(ln=>tw=Math.max(tw,g.measureText(ln).width)); const pw=Math.min(maxW,tw+18), ph=lines.length*16+10; const px=x0+c*CW+2;
     rr(px,cy-ph/2,pw,ph,ph/2,col.bg); g.save(); g.beginPath(); g.rect(px,cy-ph/2,pw,ph); g.clip();
     lines.forEach((ln,li)=>txt(ln,px+9,cy-(lines.length-1)*8+li*16,12,col.tx,500)); g.restore();}
   });
   y+=h;});
  by+=bh+GAP;});
 return cv;
}
/* 목록 그림: 항목별로 날짜순 나열 */
function drawList(S){
 const T=themeColors(); const W=720, PADX=24, scale=2;
 const fmtD=s=>{const d=parse(s);return (d.getMonth()+1)+'.'+d.getDate()+'('+WD[d.getDay()]+')';};
 const groups=S.tasks.map((t,ti)=>({t,ti,items:[...t.items].sort((a,b)=>a.date<b.date?-1:1)})).filter(x=>x.items.length);
 const lineH=22, rowPad=10;
 let H=24+56;
 groups.forEach(gp=>{H+=34; gp.items.forEach(it=>{H+=String(it.text).split('\n').length*lineH+rowPad;}); H+=12;});
 if(!groups.length)H+=60; H+=24;
 const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale; const {g,rr,txt}=painter(cv,scale);
 g.fillStyle=T.bg; g.fillRect(0,0,W,H);
 txt(S.title||'프로젝트명',PADX,24+14,21,T.ink,800,'left',W-PADX*2);
 txt(S.start.replace('-','.')+' ~ '+S.end.replace('-','.')+'  ·  '+groups.reduce((a,x)=>a+x.items.length,0)+'건 일정',PADX,24+38,12,T.ink3,400);
 let y=24+56;
 if(!groups.length)txt('등록된 일정이 없습니다',PADX,y+20,13,T.ink3,500);
 groups.forEach(gp=>{
  const cardH=34+gp.items.reduce((a,it)=>a+String(it.text).split('\n').length*lineH+rowPad,0)+2;
  rr(PADX,y,W-PADX*2,cardH,14,T.panel);
  rr(PADX+16,y+12,10,10,3,SWATCH[gp.ti%SWATCH.length]);
  txt(gp.t.name||(gp.ti+1)+'번 항목',PADX+34,y+17,14,T.ink,800,'left',W-PADX*2-50);
  let iy=y+34;
  gp.items.forEach(it=>{const lines=String(it.text).split('\n'); const col=T.cc(it.color); const h=lines.length*lineH+rowPad; const cy=iy+h/2;
   const when=fmtD(it.date)+(it.end?' ~ '+fmtD(it.end):''); const isToday=it.date<=todayStr&&(it.end||it.date)>=todayStr;
   if(isToday)rr(PADX+8,iy+3,W-PADX*2-16,h-6,10,T.today);
   txt(when,PADX+20,cy,12,T.ink2,600,'left',150);
   const px=PADX+180; const pw=W-PADX*2-180-14;
   if(it.color!=='none')rr(px-8,iy+4,pw+8,h-8,(h-8)/2,col.bg);
   lines.forEach((ln,li)=>txt(ln,px,cy-(lines.length-1)*lineH/2+li*lineH,13.5,it.color!=='none'?col.tx:T.ink,500,'left',pw-8));
   g.setLineDash([3,3]); g.strokeStyle=T.line2; g.beginPath(); g.moveTo(PADX+16,iy+h); g.lineTo(W-PADX-16,iy+h); g.stroke(); g.setLineDash([]);
   iy+=h;});
  y+=cardH+12;});
 return cv;
}
async function shareImage(S,kind){
 try{
  const cv=kind==='list'?drawList(S):drawBoard(S); const blob=await new Promise(r=>cv.toBlob(r,'image/png')); if(!blob)throw new Error('그림 생성 실패');
  const name=safe(S.title)+(kind==='list'?' 목록':'')+'.png';
  if(navigator.canShare){const file=new File([blob],name,{type:'image/png'}); if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:S.title||'일정표'});return;}catch(e){if(e&&e.name==='AbortError')return;}}}
  await download(blob,name); toast('이미지를 저장했습니다. 저장된 그림을 보내세요');
 }catch(err){console.error(err);toast('이미지를 만들지 못했습니다: '+err.message);}
}

load(); renderAll(); receiveShared();
